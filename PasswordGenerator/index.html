<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PasswordGenerator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>
<style>
    input,label{
        margin: 8px 0px;
    }

    input{
        border:none;
        border-radius: 50px;
        box-shadow: 0 0 2px 0.2px gray;
    }
</style>

<body>
    <div class="border border-dark rounded px-3 py-4" style="margin: 5% 35% ; box-shadow: 0 0 6px 0.5px rgb(149, 148, 148);">

        <h1>Password Generator</h1>
        <label for="passwordLength">Password Length</label>
        <input type="number" id="passwordLength" value="8" class="px-2" /><br />
        
        <input type="checkbox" id="includeNumber" name="includeNumber" checked />
        <label for="includeNumber">Include Number</label><br />
        
        <input type="checkbox" id="includUppercase" name="includUppercase" />
        <label for="includUppercase">Include UpperCase</label><br />
        
        <input type="checkbox" id="includeSpecialChar" name="includeSpecialChar" />
        <label for="includeNumber">Include Special Character</label><br />
        
        <input type="checkbox" id="excludeAmbigious" name="excludeAmbigious" />
        <label for="excludeAmbigious">Exclude ambigiouc character (eg. |,1,I,O,0)</label><br />
        
        <button class="btn btn-primary my-2" id="generateBtn" onclick="generatePassword()">Generate Password</button><br />
        
        <label for="generatedPassword">Generated Password</label>
        <input id="generatedPassword" type="password" class="px-2"` /><br />

        <input type="checkbox" id="showPassword" name="showPassword" onclick="showPass()"/>
        <label for="showPassword">Show Password</label>
        
        <div class="progress text-center " role="progressbar" aria-label="Info example" aria-valuenow="50" aria-valuemin="0"aria-valuemax="100" style="width: 30%">
             <div class="progress-bar  text-center" style="width: 0%; background-color: red; " id="progressBar"></div>
        </div>
        <b id="passStrengthShow">Pass Strength...</b> <br>

        <button class="btn btn-primary my-2" id="copyBtn">Copy</button>
    </div>


    <script>
        const lengthInput = document.getElementById('passwordLength') 
        const checkboxNumbers   = document.getElementById('includeNumber')
        const checkboxUppercase  = document.getElementById('includUppercase')
        const checkboxSpecial    = document.getElementById('includeSpecialChar')
        const checkboxAmbiguous  = document.getElementById('excludeAmbigious')
        const generateBtn  = document.getElementById('generateBtn')      
        const passwordDisplay   =document.getElementById('generatedPassword')
        const showPasswordCheck  = document.getElementById('showPassword')
        const strengthBar = document.getElementById('progressBar')        
        const strengthLabel = document.getElementById('passStrengthShow')   
        const copyBtn = document.getElementById('copyBtn')


        let lowercase = "abcdefghijklmnopqrstuvwxyz"
        let uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        let numbers   = "0123456789"
        let special   = "!@#$%^&*()_[]{}|;:,.<>?"
        let ambiguous = "Il1O0|"

        function buildPassStr(){
            let str = lowercase
            // console.log(str)

            if(checkboxNumbers.checked){
                str += numbers;
                // console.log(str)
            }
            if(checkboxUppercase.checked){
                str += uppercase
                // console.log(str)
            }
            if(checkboxSpecial.checked){
                str += special
                // console.log(str)
            }
            if(checkboxAmbiguous.checked){
                str = str.split("").filter(ch => !ambiguous.includes(ch)).join("")
            }

            return str
        }

        // console.log(buildPassStr())

        function generatePassword(){

            let length1 = parseInt(lengthInput.value)
            let pass = buildPassStr()
            let password1 =""

            if(pass.length <= 0){
                password1 = ""
                return
            }

            for(let i=0; i<length1; i++){
                let passIdx = Math.floor(Math.random() * pass.length)
                password1 += pass[passIdx]
            }
            // console.log(password1)
            document.getElementById('generatedPassword').value = password1

            paswordStrength()
        }

        function showPass(){
            if(showPasswordCheck.checked){
                passwordDisplay.type = 'text'; 
            }
            else{
                passwordDisplay.type = 'password';
            }
        }

        function paswordStrength(){
            let pass1 = generatedPassword.value;
            // console.log(pass1)
            score = 0;

            if(pass1.length >= 8)  score++;
            if(pass1.length >= 12) score++;
            if(pass1.length >= 16) score++;

            if(/[0-9]/.test(pass1)) score++;
            if(/[A-Z]/.test(pass1)) score++;
            if(/[!@#$%^&*()_\[\]{}|;:,.<>?]/.test(pass1)) score++;

            // console.log(score)

            if(score <= 2){
             strengthLabel.textContent = 'Weak';
             strengthBar.style.width = '25%';
             strengthBar.style.backgroundColor = 'red';
            }
            else if(score <= 3){
                strengthLabel.textContent = 'Medium';
                strengthBar.style.width = '50%';
                strengthBar.style.backgroundColor = 'orange';
            }
            else if(score <= 4){
                strengthLabel.textContent = 'Strong';
                strengthBar.style.width = '75%';
                strengthBar.style.backgroundColor = 'blue';
            }
            else{
                strengthLabel.textContent = 'Very Strong';
                strengthBar.style.width = '100%';
                strengthBar.style.backgroundColor = 'green';
            }    
        }

        copyBtn.addEventListener('click', () => {
            let passText = generatedPassword.value;

            if (passText == null) return;

            navigator.clipboard.writeText(passText);

            copyBtn.textContent = "Copied"

            setTimeout(function (){
                copyBtn.textContent = "Copy"
            },2000)

        })



        window.addEventListener('DOMContentLoaded', () => {
            generatePassword()
        })

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
