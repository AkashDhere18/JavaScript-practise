<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinner</title>
    <style>
        .spinner{
            border: 4px solid gray;
            border-top: 4px solid rgba(227, 227, 227, 0.723);
            /* border-bottom: 4px solid rgba(227, 227, 227, 0.723); */
            border-radius: 50%;
            width: 50px;
            height: 50px;
            margin: 100px auto;
            animation: spin 1s linear infinite;

        }

        @keyframes spin{
            0%{transform: rotate(0deg);}
            100%{transform: rotate(360deg);}
        }
    </style>
</head>
<body>
    <div class="spinner"></div>

    <script>
        setTimeout(()=>{
            document.querySelector('.spinner').style.display = 'none';
            document.body.innerHTML += '<h1>Data Loaded!</h1>';
        },3000);
    </script>
    
</body>
</html>
