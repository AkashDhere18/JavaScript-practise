<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>
<body>
    <div class="container border rounded text-center py-4 " style="margin: 5% auto;">
        <h1>Password Strength Checker</h1>
        <label for="PassWord">Enter Password</label>
        <input type="password" id="PassWord">
        <div class="progress  " role="progressbar" aria-label="Info example" aria-valuenow="50" aria-valuemin="0"aria-valuemax="100" style="width: 30%; margin: 24px auto;" >
             <div class="progress-bar  text-center" style="width: 25%; background-color: red; " id="progressBar"></div>
        </div>
        <b id="passStrengthShow">Weak</b> <br>
    </div>





    <script>
        const inputElement = document.getElementById('PassWord')
        const progressBarElement = document.getElementById('progressBar')
        const strengthShowElement = document.getElementById('passStrengthShow')

        inputElement.addEventListener("input" , function(){
            const inputValue = inputElement.value
            console.log(inputValue) 
            score = 0;

            if(inputValue.length >= 8) score++;
            if(inputValue.length >= 12) score++;
            if(inputValue.length >= 16) score++;

            if(/[0-9]/.test(inputValue)) score++;
            if(/[A-Z]/.test(inputValue)) score++;
            if(/[!@#$%&*?:.]/.test(inputValue)) score++;

            console.log(score)

            if(score <= 2){
                progressBarElement.style.width = '25%';
                progressBarElement.style.backgroundColor = 'red';
                strengthShowElement.textContent = "Weak";
            }
            else if(score <= 3){
                progressBarElement.style.width = '50%';
                progressBarElement.style.backgroundColor = 'orange';
                strengthShowElement.textContent = "Medium";
            }
            else if(score <= 4){
                progressBarElement.style.width = '75%';
                progressBarElement.style.backgroundColor = 'blue';
                strengthShowElement.textContent = "Strong";
            }
            else{
                progressBarElement.style.width = '100%';
                progressBarElement.style.backgroundColor = 'green';
                strengthShowElement.textContent = "Very Strong";
            }

        })
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
