<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .Modal{
            width: 30%;
            height: 20%;
            position: fixed;
            top: 2%;
            left:35%;
            visibility: hidden;
            background-color: rgb(185, 185, 185);
            box-shadow: 0 0 6px 0.5px black;
        }

        .closeBtn{
            position: absolute;
            bottom: 5%;
            right: 2%;
        }
    </style>    
</head>
<body>
    <div class="container text-center mt-5">
        <h1 >To Open Modal Click On Button</h1>
        <button class="btn btn-primary my-4" onclick="openModal()">Open</button>
    </div>
    <div class="Modal text-center rounded p-4" id="Modal">
        <p>This is the model which is opened on the button clicked</p>
        <p>To close modal click close button</p>
        <button class="btn btn-danger closeBtn" onclick="closeModal()">X</button>
    </div>



    <script>

        const modalElement = document.getElementById('Modal')
        const closeBtnEle = document.querySelector('.closeBtn')

        function openModal(){
            modalElement.style.visibility = 'visible'
        }

        function closeModal(){
            modalElement.style.visibility = 'hidden'
        }

        // closeBtnEle.addEventListener('mouseenter' , function (){
        //     modalElement.style.position = 'relative'
        //     modalElement.style.top = '50%'
        //     modalElement.style.left = '10%'

        // })

        
    </script>
</body>
</html>
