<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class=container>
        <div class="left-content">
            <h1>Welcome</h1>
            <p>If not registered provide your personal details and Register</p>
            <button class="signIn-btn" onclick="gotoRegister()">Register</button>
        </div>
        <div class="right-content">
            <h1>Login Form</h1>

            <p>Fill Out The Following Info For Login</p>

            <form class="form">
                <input type="email" placeholder="Email" id="inputEmail"/><br/>
                <input type="password" placeholder="Password" id="password"/><br/>
                <button class="signUp-btn" onclick="Login()">LOGIN</button>
            </form>
        </div>
    </div>



    <script>
        // e = 'india@gmail.com'
        // p = 'bharat'
        
        emailElement = document.querySelector('#inputEmail')
        paasswordElement = document.querySelector('#password')

        function Login(){
            event.preventDefault()

            let emailValue = emailElement.value 
            let passwordValue = paasswordElement.value 

            let storedUserData = JSON.parse(localStorage.getItem("UserData")) //get data from localstorage
            // console.log(storedUserData)

            if(emailValue.trim().length > 0 ){
                if(emailValue === storedUserData.email){

                    if(passwordValue === storedUserData.password){
                        window.location.href = './Home.html' 
                        // alert("registered")
                    }else{
                        alert("invalid credentials")
                    }

                }else{
                    alert("Not Registered")
                }

            }else{
                alert("Enter Email Address")
            }
        }

        function gotoRegister(){
            window.location.href = "./registerForm.html"
        }
    </script>
</body>
</html>
