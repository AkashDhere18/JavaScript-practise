<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration-Form</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <div class="left-content">
        <h1>Welcome</h1>
        <p>If Already Registered Login Here</p>
        <button class="signIn-btn" onclick="gotoLogin()">LOGIN</button>
        <button class="signIn-btn" onclick="gotoHome()">Home</button>
      </div>
      <div class="right-content">
        <h1>Registration Form</h1>
        <!-- <div class="login-btns">
                <button><i class="fa-brands fa-google"></i></button>
                <button><i class="fa-brands fa-facebook-f"></i></button>
                <button><i class="fa-brands fa-github"></i></button>
                <button><i class="fa-brands fa-linkedin"></i></button>
            </div> -->

        <!-- <h1>OR</h1> -->

        <p>Fill Out The Following Info For Regestration</p>

        <form class="form">
          <input type="text" placeholder="Name" id="inputName" /> <br/>
          <input type="email" placeholder="Email" id="inputEmail" /> <br/>
          <input type="password" placeholder="Password" id="password" /> <br/>
          <input type="password" placeholder="Repeat Password" id="Repassword" />

          <button class="signUp-btn" onclick="register()">Register</button>
        </form>
      </div>
    </div>

    <script>
      usernameElement = document.querySelector("#inputName");
      emailElement = document.querySelector("#inputEmail");
      passwordElement = document.querySelector("#password");
      rePasswordElement = document.querySelector("#Repassword");

      function register() {
        event.preventDefault(); //to prevent default of "form" to refresh after register click

        usernameValue = usernameElement.value;
        emailValue = emailElement.value;
        passwordValue = passwordElement.value;
        rePasswordValue = rePasswordElement.value;

        speChars = `!@#$%^&*()_{""}`;
        pattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/; //regular expression to verify email

        if (usernameValue.trim().length > 6) {
          if (!usernameValue.includes(speChars)) {
            // ***email validation***
            if (pattern.test(emailValue)) {
              //   alert("emailsuccess");

              // ***password validation***
              if (passwordValue.trim().length > 8) {
                //  ***recheck password***
                if (rePasswordValue === passwordValue) {
                  // alert("Register success");

                  // create object of user  //   name, email ,password
                  let user = {
                    name: usernameValue,
                    email: emailValue,
                    password: passwordValue,
                  };

                  localStorage.setItem("UserData", JSON.stringify(user));  //  localStorage save
                  window.location.href = "./loginForm.html";  // naviaget to login page
                }
                else {
                  alert("repassword not match password");
                }

              } else {
                alert("Enter password greater than 8 character");
              }

            }
            else {
              alert("Enter valid email");
            }

          }
          else {
            alert("username must not include special character");
          }
          
        } 
        else {
          alert(" should contain at least 6 characters");
          // erOne = " should contain at least 6 characters"
          // document.getElementById("errUserName").style.display = 'block'
          // document.getElementById("errUserName").innerHTML = `${erOne}
          //                 <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>`
        }
      }


      function gotoLogin() {
        window.location.href = "./loginForm.html";
      }

      function gotoHome() {
        window.location.href = "./Home.html";
      }

    </script>
  </body>
</html>
