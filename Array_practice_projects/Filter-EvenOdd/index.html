<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Even Odd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="container my-5 border  p-3 rounded" style="margin: auto; box-shadow: 0 0 4px 1px rgba(168, 168, 168, 0.873);">
        <h1 class="mb-3 text-center">Filter Even And Odd Numbers</h1>
        <div class="container text-center mb-4">
            <input type="number" id="inputEle" placeholder="Enter Numbers" class="mb-3 p-2" /><br/>
            <button class="btn btn-primary me-2" onclick="addNum()">Add Numbers</button>
            <button class="btn btn-primary me-2" onclick="findEven()">Show Even</button>
            <button class="btn btn-primary me-2" onclick="findOdd()">Show Odd</button>
            <button class="btn btn-primary" onclick="resetInput()">Clear</button>
        </div>

        <div class="container" id="result">
            
        </div>
        <div class="container" id="result1">
            
        </div>

    </div>



    <script>
        inputElement = document.querySelector("#inputEle")
        numberArray= [];

        function addNum(){
            inputValue =inputElement.value

            numberArray.push(parseInt(inputValue))

            console.log(numberArray)

            inputElement.value = ""
        }

        function findEven(){
            EvenNum = numberArray.filter((ele) => ele % 2 == 0)
            // console.log(EvenNum)
            document.querySelector("#result").innerHTML = `<div>
                                                             <h2 class="mb-3">Even Numbers</h2>
                                                             <p class="border rounded p-2" style="box-shadow: 0 0 4px 1px rgba(168, 168, 168, 0.873);">${EvenNum}</p>
                                                           </div> `
        }

        function findOdd(){
            OddNum = numberArray.filter((ele) => ele % 2 !== 0)
            // console.log(OddNum)
            document.querySelector("#result1").innerHTML = `<div>
                                                             <h2 class="mb-3">Odd Numbers</h2>
                                                             <p class="border rounded p-2" style="box-shadow: 0 0 4px 1px rgba(168, 168, 168, 0.873);">${OddNum}</p>
                                                           </div> `
        }

        function resetInput(){
            numberArray= [];
            document.querySelector("#result").innerHTML =""
            document.querySelector("#result1").innerHTML =""
        }
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
