<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="container  w-75 rounded py-4 my-5"
      style="background-color: rgb(222, 221, 221); height: 85vh; box-shadow: 0 0 8px 1px rgba(148, 148, 148, 0.778);"
    >
      <h1 class="mb-4 text-center">To-do List Manager</h1>
      <div class="container text-center mb-4">
        <input type="text" id="inputElement" placeholder="Add Task's Here" class="w-50 p-2 rounded border-0 mb-3" /><br/>
        <button class="btn btn-primary rounded" onclick="addToDOs()">
          Add Task
        </button>
        <button class="btn btn-primary rounded" onclick="clearAllToDo()">Clear All</button>
      </div>
      <div class="container">
        <ul id="result"></ul>
      </div>
    </div>

    <script>
      toDos = [];

      function render() {
        document.querySelector('#result').innerHTML = toDos.map((task,index) => `
        <div class='mb-1'>
            <b class='text-dark pe-5'>${task}</b>
            <button class='delete-btn text-white mb-2' onclick='deleteTask(${index})'>Delete</button>
        </div>
        `).join('');
      }

      function addToDOs() {
        inputEle = document.querySelector("#inputElement");
        inputValue = inputEle.value;
        toDos.push(inputValue);
        // console.log(toDos)
        render();
        console.log(inputEle.value);
        inputEle.value = "";
        console.log(inputEle.value);
      }

      function clearAllToDo() {
        console.log(toDos)
        toDos = [];
        render();
        console.log(toDos)
      }

      function deleteTask(i){
        toDos.splice(i,1)
        render()
      }
    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
