<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom1</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .card{
            height:400px;
            width:300px;
            border: 1px solid black;
            padding: 8px;
        }

        .cardImg img{
            width: 100%;
            height:30%;
        }

        .carBtn{
            height: 30px;
            width: 80px;
            background-color: gray;
            border: none;
            border-radius: 4px;
            margin-bottom: 6px;
        }

        .chooseColor{
            display: flex;
            gap: 4px;
            margin: 8px 0;
        }

        .colorGray{
            height: 20px;
            width: 20px;
            background-color: gray;
            border-radius: 50px;
        }

        .colorRed{
            height: 20px;
            width: 20px;
            background-color: red;
            border-radius: 50px;
        }

        .colorBlack{
            height: 20px;
            width: 20px;
            background-color: black;
            border-radius: 50px;
        }

        .addToCartBtn{
            height: 30px;
            width: 160px;
            background-color: gray;
            border: none;
            border-radius: 4px;
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div>
        <h1>Continental GT650</h1>
    </div>
    <div>
        <div class="card">
            <div class="cardImg">
                <img src="./assets/Conti-GT-Mr_clean.jpg">
            </div>
            <div class="cardBody">
                <button class="carBtn btn">CAR</button>
                <h3>Continental GT650</h3>
                <p>Mileage:</p>
                <p>Fuel:</p>
                <p>Saftey:</p>

                <p>Pick a color</p>
                <div class="chooseColor">
                    <div class="colorGray" onclick="colorChangeGray()"></div>
                    <div class="colorRed" onclick="colorChangeRed()"></div>
                    <div class="colorBlack" onclick="colorChangeBlack()"></div>
                </div>

                <button class="addToCartBtn btn">Add to cart</button>
            </div>
        </div>
    </div>


    <script>

        // const btntags = document.querySelectorAll('.btn')
        btntags = document.querySelectorAll('.btn')

        function colorChangeGray(){
           btntags.forEach(element => {
            element.style.backgroundColor = 'gray'
           });
        }

        function colorChangeRed(){
           btntags.forEach(element => {
            element.style.backgroundColor = 'red'
           });
        }

        function colorChangeBlack(){
           btntags.forEach(element => {
            element.style.backgroundColor = 'black'
            element.style.color = 'white'
           });
        }
    </script>
</body>
</html>
